<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXORA Luxury Catalogue</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: gold;
        }
        .admin-panel {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 5px;
        }
        .category {
            cursor: pointer;
            padding: 10px;
            margin: 5px;
            border: 1px solid gold;
            transition: 0.3s;
        }
        .category:hover {
            background: gold;
            color: #121212;
        }
    </style>
</head>
<body>
    <header>
        <h1>LUXORA Luxury Catalogue</h1>
        <div class="admin-panel">
            <h2>Admin Panel</h2>
            <input type="password" id="admin-password" placeholder="Enter password"/>
            <button onclick="login()">Login</button>
        </div>
    </header>

    <main>
        <section id="product-management">
            <h2>Product Management</h2>
            <div>
                <input type="file" id="image-upload" />
                <input type="text" id="product-name" placeholder="Product Name" />
                <button onclick="addProduct()">Add Product</button>
            </div>

            <h3>Categories</h3>
            <div id="categories">
                <div class="category" onclick="browseCategory('Category1')">Category 1</div>
                <div class="category" onclick="browseCategory('Category2')">Category 2</div>
                <div class="category" onclick="browseCategory('Category3')">Category 3</div>
            </div>
        </section>
    </main>

    <footer>
        <p>WhatsApp Integration Link: <a href="https://wa.me/1234567890">Chat with us</a></p>
    </footer>

    <script>
        const products = JSON.parse(localStorage.getItem('products')) || [];
        const adminPassword = 'luxora2024';

        function login() {
            const password = document.getElementById('admin-password').value;
            if (password === adminPassword) {
                alert('Login Successful!');
                // proceed to show admin functionalities
            } else {
                alert('Incorrect Password!');
            }
        }

        function addProduct() {
            const imageFile = document.getElementById('image-upload').files[0];
            const productName = document.getElementById('product-name').value;
            if (imageFile && productName) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const product = {
                        name: productName,
                        image: e.target.result
                    };
                    products.push(product);
                    localStorage.setItem('products', JSON.stringify(products));
                    alert('Product added successfully!');
                    // Refresh the product list or UI
                };
                reader.readAsDataURL(imageFile);
            } else {
                alert('Please provide both an image and a product name.');
            }
        }

        function browseCategory(category) {
            alert('Browsing ' + category);
            // Logic to display products of the selected category
        }
    </script>
</body>
</html>
