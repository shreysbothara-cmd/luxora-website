<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LUXORA Luxury Catalogue">
    <title>LUXORA Luxury Catalogue</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #1c1c1e;
            color: #f9f9f9;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: gold;
        }
        .container {
            width: 80%;
            margin: auto;
        }
        .product {
            border: 1px solid gold;
            border-radius: 5px;
            padding: 10px;
            margin: 10px;
        }
        .admin-panel {
            background-color: #2c2c2e;
            padding: 20px;
            border-radius: 5px;
        }
        .whatsapp {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LUXORA Luxury Catalogue</h1>
        <div class="admin-panel">
            <h2>Admin Panel</h2>
            <input type="password" placeholder="Password" id="admin-password">
            <button onclick="checkPassword()">Login</button>
        </div>
        <div class="products">
            <div class="product">
                <h3>Product Name</h3>
                <p>Product Description</p>
                <p>Price: $XXX</p>
                <input type="file" accept="image/*" onchange="uploadImage(event)">
            </div>
            <!-- More products can be added similarly -->
        </div>
        <div class="whatsapp">
            <a href="https://wa.me/your-phone-number">Chat with us on WhatsApp</a>
        </div>
    </div>
    <script>
        function checkPassword() {
            const password = document.getElementById('admin-password').value;
            if (password === 'luxora2024') {
                alert('Login successful!');
                // Here you can redirect to admin panel
            } else {
                alert('Incorrect password!');
            }
        }
        function uploadImage(event) {
            const file = event.target.files[0];
            console.log('Image uploaded:', file);
            // Handle image upload logic here
        }
    </script>
</body>
</html>
