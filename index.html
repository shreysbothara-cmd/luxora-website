<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>LUXORA Luxury Catalogue</title>
    <style>
        body { background-color: #0c0c0c; color: #ffffff; font-family: Arial, sans-serif; }
        .gold-accent { color: gold; }
        header, footer { text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <header>
        <h1 class="gold-accent">LUXORA Luxury Catalogue</h1>
    </header>
    <main>
        <section id="products">
            <!-- Product items will be populated here -->
        </section>
    </main>
    <footer>
        <p>Contact us via <a href="https://wa.me/1234567890">WhatsApp</a></p>
    </footer>
    <script>
        const products = [];

        function loadProducts() {
            // Load product data
            // Example:
            const product = {
                name: 'Luxury Item',
                price: 100,
                image: 'image.jpg'
            };
            products.push(product);
            displayProducts();
        }

        function displayProducts() {
            const productsSection = document.getElementById('products');
            productsSection.innerHTML = '';
            products.forEach((product) => {
                const productDiv = document.createElement('div');
                productDiv.innerHTML = `<h2>${product.name}</h2><p>${product.price}</p><img src="${product.image}" alt="${product.name}" />`;
                productsSection.appendChild(productDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', loadProducts);

        // Admin Panel Functionality
        const adminPassword = 'luxora2024';
        function checkAdminPassword() {
            const inputPassword = prompt('Enter admin password:');
            if (inputPassword === adminPassword) {
                alert('Access granted to admin panel.');
                // Admin panel code goes here
            } else {
                alert('Access denied.');
            }
        }
        checkAdminPassword();
    </script>
</body>
</html>
